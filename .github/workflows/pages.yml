name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'rfcs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'rfcs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.1

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache book tools
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: book-tools-${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}
      - name: Install book tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install mdbook --version "$MDBOOK_VERSION" --locked
          cargo install mdbook-mermaid --version "$MDBOOK_MERMAID_VERSION" --locked
      # The diagram scripts are not kept in version control.
      - name: Extract diagram scripts
        run: mdbook-mermaid install rfcs
      - name: Build book
        run: mdbook build rfcs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/rfcs-book

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
