name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # GPUI links display-server libraries and rav1d needs NASM on x86.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libvulkan-dev nasm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Each feature gates part of the API, so each is linted on its own.
      - name: clippy for every feature alone
        run: |
          for features in read write; do
            echo "::group::mbook, features '$features'"
            cargo clippy -p mbook --all-targets --no-default-features --features "$features" --locked -- -D warnings
            echo "::endgroup::"
          done
          # Each import format and the export-only build.
          for features in epub fb2 pdf cbz docx html md txt export; do
            echo "::group::mbook-converter, features '$features'"
            cargo clippy -p mbook-converter --all-targets --no-default-features --features "$features" --locked -- -D warnings
            echo "::endgroup::"
          done
          # The application without its updater, as a store would build it.
          cargo clippy -p mbook-ui --all-targets --no-default-features --locked -- -D warnings
      - name: docs for every feature set
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --all-features --locked
          for features in read write; do
            cargo doc -p mbook --no-deps --no-default-features --features "$features" --locked
          done
          for features in epub fb2 pdf cbz docx html md txt export; do
            cargo doc -p mbook-converter --no-deps --no-default-features --features "$features" --locked
          done
      - run: cargo package -p mbook --locked

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Keep backtrace line numbers while limiting the size of GPUI test
      # binaries on the ARM runner.
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.os == 'ubuntu-24.04-arm' && 'line-tables-only' || 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GPUI links display-server libraries and rav1d needs NASM on x86.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libvulkan-dev nasm
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p mbook --no-default-features --features read --locked
      - run: cargo test -p mbook --no-default-features --features write --locked
      - name: mbook-converter, each import format and export alone
        shell: bash
        run: |
          for features in epub fb2 pdf cbz docx html md txt export; do
            cargo test -p mbook-converter --no-default-features --features "$features" --locked
          done

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The rust-version `Cargo.toml` declares.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      # The application and the converter's export feature use a newer
      # compiler. The libraries' default features support Rust 1.89.
      - run: cargo check --workspace --exclude mbook-ui --all-targets --locked
      - run: cargo test --workspace --exclude mbook-ui --locked
