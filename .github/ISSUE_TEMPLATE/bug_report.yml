name: Bug report
description: A crash, panic, wrong result, or error from mbook.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the bug could be a security problem (a panic
        or unbounded resource use on an untrusted file, a path that escapes
        the book), do not file it here; follow
        [SECURITY.md](https://github.com/M-Compressors/mbook/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A self-contained Rust snippet or test. Attach the book that is needed
        to reproduce (zip it if GitHub rejects the extension).
      render: rust
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Reading (`BookReader`, `Book::read`)
        - Creating and editing (`Book`)
        - Writing and checking (`Book::write`, `Book::check`)
        - Metadata (`Meta`)
        - Cargo features
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or panic output
      description: Include the full backtrace (`RUST_BACKTRACE=1`) for a panic.
      render: text
  - type: input
    id: version
    attributes:
      label: mbook version or commit
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Rust version and platform
      placeholder: rustc 1.89.0, aarch64-apple-darwin
