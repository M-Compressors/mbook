[workspace]
resolver = "3"
members = ["crates/mbook", "crates/mbook-converter", "crates/mbook-ui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/M-Compressors/mbook"
homepage = "https://m-compressors.github.io/mbook/"

[workspace.dependencies]
# Only what more than one crate uses. A dependency of a single crate is
# declared in that crate's own manifest.
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
markdown = "1.0.0"
tempfile = "3.10"
percent-encoding = "2"
github-slugger = "0.1"
mbook = { path = "crates/mbook", version = "0.2.0", default-features = false }
# Decodes pictures and encodes them as AVIF; `avif` is the encoder, built on
# `ravif` and `rav1e`. The converter uses it for the pictures of a source,
# the application for a picture added in its editor.
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "jpeg", "png", "rayon", "webp"] }

# Decodes stored pictures in the reader and in picture-capable export builds.
avif-decode = { version = "3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# A library returns errors; it does not panic or print.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# A lint is silenced with a narrow `#[expect(.., reason = "..")]`, never with
# `#[allow]`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.pre-release]
inherits = "release"
lto = "off"
codegen-units = 16
