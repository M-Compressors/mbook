[book]
title = "mbook design documents"
description = "RFCs and decision records for mbook, a book file format built on OpenZL frames."
language = "en"
src = "src"

[build]
# Keep generated HTML next to Cargo's own build output.
build-dir = "../target/rfcs-book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# Specifications quote exact bytes and ASCII punctuation; never rewrite them.
smart-punctuation = false
mathjax-support = false
no-section-label = true
git-repository-url = "https://github.com/M-Compressors/mbook"
# The book is published at https://m-compressors.github.io/mbook/.
site-url = "/mbook/"
# Extracted by `mdbook-mermaid install rfcs`; not kept in version control.
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.playground]
# The Rust playground does not provide mopenzl.
runnable = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
