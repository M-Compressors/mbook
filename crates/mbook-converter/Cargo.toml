[package]
name = "mbook-converter"
description = "Convert books between mbook and EPUB, DOCX, PDF and other formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebook", "epub", "fb2", "pdf", "converter"]
categories = ["encoding", "parser-implementations"]
build = "build.rs"

[features]
default = ["epub", "fb2", "pdf", "cbz", "docx", "html", "md", "txt"]
# One feature per import format.
epub = ["dep:rbook", "dep:htmd", "dep:image"]
fb2 = ["dep:quick-xml", "dep:base64", "dep:image"]
pdf = ["dep:unpdf", "dep:image"]
cbz = ["dep:quick-xml", "dep:alphanumeric-sort", "dep:image"]
docx = ["dep:undoc", "dep:image"]
html = ["dep:htmd", "dep:base64", "dep:encoding_rs", "dep:chardetng", "dep:image"]
# One Markdown document. `markdown` itself is always a dependency: the
# assembler reads every chapter with it.
md = ["dep:github-slugger", "dep:encoding_rs", "dep:chardetng"]
txt = ["dep:encoding_rs", "dep:chardetng"]
# All writers and their AVIF decoder. This feature currently needs Rust 1.98.
export = [
    "mbook/read",
    "dep:avif-decode",
    "dep:avif-parse",
    "dep:base64",
    "dep:docx-rs",
    "dep:epub-builder",
    "dep:html-escape",
    "dep:image",
    "dep:krilla",
    "dep:pulldown-cmark",
    "dep:pulldown-cmark-to-cmark",
    "dep:quick-xml",
    "dep:textwrap",
    "dep:unpdf",
    "dep:xmlwriter",
]

[dependencies]
mbook = { workspace = true, features = ["write"] }
thiserror.workspace = true
markdown.workspace = true
percent-encoding.workspace = true
unicode-normalization = "0.1"
uuid = { workspace = true, features = ["v5"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { workspace = true, optional = true }
encoding_rs = { version = "0.8", optional = true }
github-slugger = { workspace = true, optional = true }
chardetng = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
htmd = { version = "0.6", optional = true }
rbook = { version = "0.7", default-features = false, optional = true }
# Reads FictionBook and `ComicInfo.xml`. `encoding` is for documents that are
# not UTF-8, which is common for FictionBook; `escape-html` for the entities
# of HTML, such as `&nbsp;`, that FictionBook files use although XML has none.
quick-xml = { version = "0.42", features = ["encoding", "escape-html"], optional = true }
# The order of the pages of a comic: `page2` before `page10`.
alphanumeric-sort = { version = "1.5", optional = true }
unpdf = { version = "0.55", default-features = false, features = ["raster"], optional = true }
undoc = { version = "0.28", default-features = false, features = ["docx"], optional = true }
# The writers share a stream of CommonMark events.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
pulldown-cmark-to-cmark = { version = "23", optional = true }
html-escape = { version = "0.2", optional = true }
xmlwriter = { version = "0.1", optional = true }
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"], optional = true }
docx-rs = { version = "0.4.22", default-features = false, optional = true }
krilla = { version = "0.7", optional = true }
textwrap = { version = "0.16", optional = true }
avif-decode = { workspace = true, optional = true }
avif-parse = { version = "2.1", optional = true }

[dev-dependencies]
# Tests read the converted books back.
mbook = { workspace = true, features = ["read", "write"] }
# Test sources are built in memory: pictures with `image`, archives with
# `zip`, which is a dependency of every build already.
image.workspace = true
base64 = "0.23"

[lints]
workspace = true
