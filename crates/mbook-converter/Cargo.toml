[package]
name = "mbook-converter"
description = "Convert books between mbook and EPUB, DOCX, PDF and other formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebook", "epub", "fb2", "pdf", "converter"]
categories = ["encoding", "parser-implementations"]
build = "build.rs"

[features]
default = ["epub", "fb2", "pdf", "cbz", "docx", "html", "md", "txt"]
# One feature per import format.
epub = ["dep:rbook", "dep:htmd", "dep:image"]
fb2 = ["dep:quick-xml", "dep:base64", "dep:image"]
pdf = ["dep:unpdf", "dep:image"]
cbz = ["dep:quick-xml", "dep:alphanumeric-sort", "dep:image"]
docx = ["dep:undoc", "dep:image"]
html = ["dep:htmd", "dep:base64", "dep:encoding_rs", "dep:chardetng", "dep:image"]
# One Markdown document. `markdown` itself is always a dependency: the
# assembler reads every chapter with it.
md = ["dep:github-slugger", "dep:encoding_rs", "dep:chardetng"]
txt = ["dep:encoding_rs", "dep:chardetng"]
# Encodes the pictures of a source on all cores at once instead of one after
# another. Without a format that carries pictures it does nothing.
rayon = ["dep:rayon"]
# All writers, their AVIF decoder, and the drawing of diagrams and formulas
# (`figure`). This feature currently needs Rust 1.98.
export = [
    "mbook/read",
    "dep:ab_glyph",
    "dep:avif-decode",
    "dep:avif-parse",
    "dep:base64",
    "dep:docx-rs",
    "dep:epub-builder",
    "dep:html-escape",
    "dep:image",
    "dep:krilla",
    "dep:merman",
    "dep:pulldown-cmark",
    "dep:pulldown-cmark-to-cmark",
    "dep:quick-xml",
    "dep:ratex-font",
    "dep:ratex-layout",
    "dep:ratex-parser",
    "dep:ratex-svg",
    "dep:ratex-types",
    "dep:ratex-unicode-font",
    "dep:resvg",
    "dep:serde_json",
    "dep:textwrap",
    "dep:unpdf",
    "dep:xmlwriter",
]

[dependencies]
mbook = { workspace = true, features = ["write"] }
thiserror.workspace = true
markdown.workspace = true
percent-encoding.workspace = true
unicode-normalization = "0.1"
uuid = { workspace = true, features = ["v5"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { workspace = true, optional = true }
# The thread pool on which `image` and `rav1e` already encode a picture.
rayon = { workspace = true, optional = true }
encoding_rs = { version = "0.8", optional = true }
github-slugger = { workspace = true, optional = true }
chardetng = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
htmd = { version = "0.6", optional = true }
rbook = { version = "0.7", default-features = false, optional = true }
# Reads FictionBook and `ComicInfo.xml`. `encoding` is for documents that are
# not UTF-8, which is common for FictionBook; `escape-html` for the entities
# of HTML, such as `&nbsp;`, that FictionBook files use although XML has none.
quick-xml = { version = "0.42", features = ["encoding", "escape-html"], optional = true }
# The order of the pages of a comic: `page2` before `page10`.
alphanumeric-sort = { version = "1.5", optional = true }
unpdf = { version = "0.55", default-features = false, features = ["raster"], optional = true }
undoc = { version = "0.29", default-features = false, features = ["docx"], optional = true }
# The writers share a stream of CommonMark events.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
pulldown-cmark-to-cmark = { version = "23", optional = true }
html-escape = { version = "0.3", optional = true }
xmlwriter = { version = "0.1", optional = true }
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"], optional = true }
docx-rs = { version = "0.4.22", default-features = false, optional = true }
krilla = { version = "0.8", optional = true }
textwrap = { version = "0.16", optional = true }
avif-decode = { workspace = true, optional = true }
avif-parse = { version = "2.1", optional = true }
# Diagrams in Mermaid notation, drawn as SVG; without ELK, whose layout is
# EPL-2.0, and without math in labels.
merman = { version = "0.11", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"], optional = true }
# Formulas in the notation of KaTeX: parsed, laid out and written as SVG with
# the glyphs as outlines, so that no font has to be installed.
ratex-parser = { version = "0.1", optional = true }
ratex-layout = { version = "0.1", optional = true }
ratex-types = { version = "0.1", optional = true }
ratex-svg = { version = "0.1", features = ["embed-fonts"], optional = true }
# The metrics of letters the KaTeX fonts do not have (Cyrillic): `ratex`
# draws them with a system font and guesses their room, so the real sizes
# are read from that font (`figure/glyphs.rs`).
ratex-font = { version = "0.1", optional = true }
ratex-unicode-font = { version = "0.1", optional = true }
ab_glyph = { version = "0.2", optional = true }
# The configuration of `merman` and the generic walk over a parsed formula.
serde_json = { version = "1", optional = true }
# Rasterises a drawn diagram or formula for the writers, with the system
# fonts for the labels of a diagram. Without `raster-images`: a figure holds
# no pictures of its own.
resvg = { workspace = true, optional = true }

[dev-dependencies]
# Tests read the converted books back.
mbook = { workspace = true, features = ["read", "write"] }
# Test sources are built in memory: pictures with `image`, archives with
# `zip`, which is a dependency of every build already.
image.workspace = true
base64 = "0.23"

[lints]
workspace = true
