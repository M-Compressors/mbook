[package]
name = "mbook"
description = "Read, edit and create mbook files: Markdown chapters and AVIF pictures in one indexed container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebook", "book", "markdown", "avif"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["read", "write"]
# `BookReader`, `Book::read` and `Book::open`.
read = ["dep:mopenzl", "mopenzl/decompression"]
# Everything that creates, changes or saves a `Book`.
write = [
    "dep:mopenzl",
    "mopenzl/compression",
    "dep:markdown",
    "dep:uuid",
    "dep:bytes",
    "dep:tempfile",
    "dep:github-slugger",
]

[dependencies]
thiserror.workspace = true
# Each feature picks `compression` or `decompression`. 0.2.6 is the first
# version with `FramedIndex`, which `BookReader` is built on.
mopenzl = { version = "0.2.6", default-features = false, features = ["std", "framed", "all-codecs"], optional = true }
markdown = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
bytes = { version = "1.10", optional = true }
tempfile = { workspace = true, optional = true }
github-slugger = { workspace = true, optional = true }
percent-encoding.workspace = true

[dev-dependencies]
# The tests build containers by hand, to give the reader files that the
# writer of this crate never produces.
mopenzl = { version = "0.2.6", default-features = false, features = ["std", "framed", "all-codecs", "compression", "decompression"] }
tempfile.workspace = true

[lints]
workspace = true
