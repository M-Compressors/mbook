    en: "%{title} is already in the library"
    ru: "«%{title}» уже есть в библиотеке"
  not_added:
    en: "%{name} could not be added: %{reason}"
    ru: "Не удалось добавить %{name}: %{reason}"
  err:
    io:
      en: "a file could not be read or written"
      ru: "не удалось прочитать или записать файл"
