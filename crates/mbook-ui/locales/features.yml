    catalogue:
      en: "the book could not be added to the catalogue"
      ru: "не удалось добавить книгу в каталог"
update:
  checking:
    en: "Checking for updates…"
    ru: "Проверка обновлений…"
  up_to_date:
    en: "mbook is up to date"
    ru: "У вас последняя версия mbook"
  available:
    en: "Version %{version} is available"
    ru: "Доступна версия %{version}"
  waiting:
    en: "The update will be installed when the import or the edit is finished"
    ru: "Обновление будет установлено, когда завершится импорт или редактирование"
  installing:
    en: "Downloading and verifying…"
    ru: "Загрузка и проверка…"
  restart_to_finish:
    en: "Restart to finish"
    ru: "Перезапустите, чтобы завершить"
  check_failed:
    en: "Could not check for updates: %{reason}"
    ru: "Не удалось проверить обновления: %{reason}"
  failed:
    en: "The update failed: %{reason}"
    ru: "Не удалось обновить: %{reason}"
  installed:
    en: "Version %{version} is installed. Restart to finish."
    ru: "Версия %{version} установлена. Перезапустите, чтобы завершить."
  being_installed:
    en: "Version %{version} is being installed."
    ru: "Устанавливается версия %{version}."
  restart_waits:
    en: "Finish the import or close the editor first; then restart to finish the update"
    ru: "Сначала дождитесь конца импорта или закройте редактор, затем перезапустите, чтобы завершить обновление"
  update:
    en: "Update"
    ru: "Обновить"
  later:
    en: "Later"
    ru: "Позже"
  restart:
    en: "Restart"
    ru: "Перезапустить"
  try_again:
    en: "Try again"
    ru: "Повторить"
  region:
    en: "Application update"
    ru: "Обновление приложения"
  err:
    releases:
      en: "the releases of the repository could not be asked"
      ru: "не удалось запросить выпуски из репозитория"
    download:
      en: "the update could not be downloaded"
      ru: "не удалось загрузить обновление"
    signature:
      en: "the signature of the update is not valid"
      ru: "подпись обновления недействительна"
    unpack:
      en: "the update could not be unpacked"
      ru: "не удалось распаковать обновление"
    missing:
      en: "the update holds no %{file}"
      ru: "в обновлении нет %{file}"
    io:
      en: "a file of the update could not be written"
      ru: "не удалось записать файл обновления"
    not_in_bundle:
      en: "the running program is not inside an application bundle: %{path}"
      ru: "запущенная программа находится не в пакете приложения: %{path}"
    unsupported:
      en: "updates cannot be installed on this platform"
      ru: "на этой платформе нельзя устанавливать обновления"
edit:
  err:
    open:
      en: "the book could not be opened"
      ru: "не удалось открыть книгу"
    refused:
      en: "the book refused the change"
      ru: "книга не приняла изменение"
    save:
      en: "the book could not be saved"
      ru: "не удалось сохранить книгу"
    contents:
      en: "the contents were not changed"
      ru: "оглавление не изменено"
    no_such_path:
      en: "nothing in the book has the path %{path}"
      ru: "в книге нет ничего по пути %{path}"
    ended:
      en: "the editing session has ended"
      ru: "сеанс редактирования завершён"
    conflict:
      en: "an agent changed this chapter while you were typing; your text is kept here and replaces the agent's when you go on typing"
      ru: "агент изменил эту главу, пока вы печатали; ваш текст сохранён здесь и заменит текст агента, когда вы продолжите печатать"
    automatic:
      en: "the contents follow the headings, so there is no list to change"
      ru: "оглавление строится по заголовкам, поэтому списка для изменения нет"
    no_such_entry:
      en: "the list has no entry at position %{position}"
      ru: "в списке нет пункта на позиции %{position}"
    no_title:
      en: "an entry needs a title"
      ru: "у пункта оглавления должно быть название"
    no_such_place:
      en: "the entry %{title} leads to no chapter or heading of the book"
      ru: "пункт %{title} не ведёт ни к главе, ни к заголовку книги"
    too_deep:
      en: "an entry can be only one level under the entry above it"
      ru: "пункт может быть только на один уровень ниже пункта над ним"
    top_level:
      en: "the entry is at the first level already"
      ru: "пункт уже на первом уровне"
