_version: 2
# The menu bar of macOS.
menu:
  about:
    en: "About %{name}"
    ru: "О программе %{name}"
  settings:
    en: "Settings…"
    ru: "Настройки…"
  services:
    en: "Services"
    ru: "Службы"
  quit:
    en: "Quit %{name}"
    ru: "Завершить %{name}"
  file:
    en: "File"
    ru: "Файл"
  add_book:
    en: "Add a book…"
    ru: "Добавить книгу…"
  save:
    en: "Save"
    ru: "Сохранить"
  edit:
    en: "Edit"
    ru: "Правка"
  undo:
    en: "Undo"
    ru: "Отменить"
  redo:
    en: "Redo"
    ru: "Повторить"
  cut:
    en: "Cut"
    ru: "Вырезать"
  copy:
    en: "Copy"
    ru: "Скопировать"
  paste:
    en: "Paste"
    ru: "Вставить"
  select_all:
    en: "Select all"
    ru: "Выбрать все"
  find:
    en: "Find…"
    ru: "Найти…"
# Opening the library, and the About dialog.
app:
  opening:
    en: "Opening your library"
    ru: "Открытие библиотеки"
  damaged_notice:
    en: "The library index was damaged and has been rebuilt. Reading places and settings were reset."
    ru: "Индекс библиотеки был повреждён и создан заново. Места чтения и настройки сброшены."
  open_failed:
    en: "mbook could not open your library"
    ru: "mbook не удалось открыть библиотеку"
  open_failed_hint:
    en: "%{reason}. Close other copies of mbook, check that its folder can be written to, and try again."
    ru: "%{reason}. Закройте другие копии mbook, проверьте, что в его папку разрешена запись, и повторите попытку."
  try_again:
    en: "Try again"
    ru: "Повторить"
  error_folders:
    en: "the folders of the library could not be prepared"
    ru: "не удалось подготовить папки библиотеки"
  error_catalogue:
    en: "the catalogue could not be opened"
    ru: "не удалось открыть каталог"
  error_books:
    en: "the folder of the books could not be read"
    ru: "не удалось прочитать папку с книгами"
  error_damaged:
    en: "the damaged catalogue could not be moved aside"
    ru: "не удалось переместить повреждённый каталог"
  add_books:
    en: "Add books"
    ru: "Добавить книги"
  books_filter:
    en: "Books"
    ru: "Книги"
  about_version:
    en: "Version %{version}"
    ru: "Версия %{version}"
  about_licence:
    en: "MIT or Apache-2.0"
    ru: "MIT или Apache-2.0"
  close:
    en: "Close"
    ru: "Закрыть"
agent:
  confirm:
    title:
      en: "%{client} asks"
      ru: "%{client} спрашивает"
    allow:
      en: "Allow"
      ru: "Разрешить"
    decline:
      en: "Decline"
      ru: "Отказать"
    remove_chapter:
      en: "Remove the chapter %{chapter} from “%{book}”? This cannot be undone once the book is saved."
      ru: "Удалить главу %{chapter} из «%{book}»? После сохранения книги это не отменить."
    remove_picture:
      en: "Remove the picture %{path} from “%{book}”? This cannot be undone once the book is saved."
      ru: "Удалить картинку %{path} из «%{book}»? После сохранения книги это не отменить."
    remove_figure:
      en: "Remove %{path} from “%{book}”? This cannot be undone once the book is saved."
      ru: "Удалить %{path} из «%{book}»? После сохранения книги это не отменить."
    discard:
      en: "Throw away every unsaved change of “%{book}”, yours too, and read it again from its file?"
      ru: "Отбросить все несохранённые изменения «%{book}», включая ваши, и перечитать книгу из файла?"
    delete:
      en: "Delete “%{book}” from the library, its file too? This cannot be undone."
      ru: "Удалить «%{book}» из библиотеки вместе с файлом? Это не отменить."
    overwrite:
      en: "Write over the file %{path}?"
      ru: "Перезаписать файл %{path}?"
    import:
      en: "Read the book file %{path} into the library?"
      ru: "Прочитать файл книги %{path} в библиотеку?"
    read_picture:
      en: "Read the picture file %{path} into “%{book}”?"
      ru: "Прочитать файл картинки %{path} в «%{book}»?"
    export:
      en: "Write the book to the new file %{path}?"
      ru: "Записать книгу в новый файл %{path}?"
  always:
    remove_chapter:
      en: "Allow removing chapters for the rest of this session"
      ru: "Разрешать удалять главы в этой сессии"
    remove_picture:
      en: "Allow removing pictures for the rest of this session"
      ru: "Разрешать удалять картинки в этой сессии"
    remove_figure:
      en: "Allow removing diagrams and formulas for the rest of this session"
      ru: "Разрешать удалять диаграммы и формулы в этой сессии"
    discard:
      en: "Allow discarding unsaved changes for the rest of this session"
      ru: "Разрешать отбрасывать несохранённые изменения в этой сессии"
    delete_book:
      en: "Allow deleting books for the rest of this session"
      ru: "Разрешать удалять книги в этой сессии"
    import:
      en: "Allow adding books from files for the rest of this session"
      ru: "Разрешать добавлять книги из файлов в этой сессии"
    read_picture:
      en: "Allow adding pictures from files for the rest of this session"
      ru: "Разрешать добавлять картинки из файлов в этой сессии"
    export:
      en: "Allow writing new files for the rest of this session"
      ru: "Разрешать записывать новые файлы в этой сессии"
    overwrite:
      en: "Allow writing over files for the rest of this session"
      ru: "Разрешать перезаписывать файлы в этой сессии"
  working:
    en: "An agent is at work"
    ru: "Работает агент"
  quit:
    title:
      en: "Agents left changes that are not saved"
      ru: "Агенты оставили несохранённые изменения"
    detail:
      en: "%{count} book(s) edited by an agent have changes that are not saved. They are lost when the window closes."
      ru: "В книгах, которые правил агент (%{count}), есть несохранённые изменения. Они пропадут, когда окно закроется."
    discard:
      en: "Close without saving"
      ru: "Закрыть без сохранения"
    save:
      en: "Save and close"
      ru: "Сохранить и закрыть"
