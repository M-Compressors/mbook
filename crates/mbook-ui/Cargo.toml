[package]
name = "mbook-ui"
description = "A reading application for mbook files: a library, a reader and an editor"
version.workspace = true
edition.workspace = true
# Above the workspace: `avif-decode` needs Rust 1.98 and `redb` 1.90
# (mbook-ui docs, "Crate and workspace").
rust-version = "1.100"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebook", "reader", "gpui", "mbook"]
categories = ["gui", "multimedia"]
build = "build.rs"
# An application, installed from the releases of the repository.
publish = false

# Read by `cargo bundle`, which the release workflow runs.
[package.metadata.bundle]
name = "mbook"
identifier = "io.github.m-compressors.mbook"
icon = ["assets/icon.png", "assets/icon@2x.png"]
category = "public.app-category.reference"
osx_minimum_system_version = "11.0"
# The book formats the application opens, as Finder offers them.
osx_info_plist_exts = ["assets/macos/document-types.plist"]

[lib]
name = "mbook_ui"

[[bin]]
name = "mbook"
path = "src/main.rs"
# The executable has the name of the `mbook` library: its documentation would
# be written over that one.
doc = false

[features]
default = ["self-update"]
# Checks the releases of the repository for a newer version and installs it.
# A build for a store or a package manager leaves it off.
self-update = ["dep:self_update"]
# Renders every screen to a PNG file in a headless window, for `tests/visual.rs`
# and for a person who wants to look at the screens (mbook-ui docs, "Testing").
# It needs the testing tools of the Kit to drive the pages; the application
# does not use it.
visual = ["gpui-kit/test-support"]

[dependencies]
mbook = { workspace = true, features = ["read", "write"] }
# `rayon`: an import encodes the pictures of a book on all cores at once.
mbook-converter = { path = "../mbook-converter", features = ["export", "rayon"] }
image.workspace = true
markdown.workspace = true
percent-encoding.workspace = true
regex = "1"
unicode-segmentation = "1"
tempfile.workspace = true
thiserror.workspace = true
uuid.workspace = true
# GPUI, its component library and their assets behind one name; application
# code imports `gpui_kit` only. The engine is chosen per target below: GPUI
# Fast on the desktop, gpui-pre on Android, where gpui-mobile is the platform
# (mbook-ui docs, "Design").
gpui-kit = { version = "0.11", features = ["tree-sitter-markdown"] }
gpui-kit-markdown-editor = "0.4.1"
# Grammars for the diagram and formula source dialogs.
tree-sitter-mermaid = "0.3.5"
codebook-tree-sitter-latex = "0.6.1"
# Keep original source blocks when updating Markdown from the visual editor.
similar = { version = "3", default-features = false }
# The languages of the interface (mbook-ui docs, "Languages"): the strings of
# `locales/` and the locale GPUI Component translates its own controls in;
# one process-wide locale serves both.
rust-i18n = "4.2"
# The languages the system prefers, in order, chosen from at start.
sys-locale = "0.3"
# The plural category of a count (`one`, `few`, `many`, `other`) by the rules
# of the CLDR; Russian has three forms where English has two.
icu_plurals = "2"
# The `locale!` macro that names a locale to `icu_plurals`.
icu_locale_core = "2"
# The catalogue: reading places, settings and a copy of each book's metadata.
redb = "5"
# Decodes the AVIF pictures of a book; pure Rust, on `rav1d`. Without its
# `binary` feature, which is a command-line tool.
avif-decode.workspace = true
# The channel between the editor and the task that owns the book.
futures = "0.3"
# The thread pool of CPU-bound work (mbook-ui docs, "Threads").
rayon.workspace = true
# Updates from the releases of the repository. The blocking `ureq` transport
# runs inside a background task, so no second runtime is needed; `signatures`
# verifies an archive against a key built into the application.
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "signatures"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The GPUI Fast engine. Cargo leaves the features of a target table out of
# a build for another target, so Android stays on gpui-pre.
gpui-kit = { version = "0.11", features = ["gpui-fast", "tree-sitter-markdown"] }
gpui-kit-markdown-editor = { version = "0.4.1", features = ["gpui-fast"] }
# Native file pickers with extension filters.
rfd = "0.18"
# The share sheet of the platform: NSSharingServicePicker on macOS,
# DataTransferManager on Windows. Android shares through the activity of
# `mbook-android` (mbook-ui docs, "Design").
robius-share = "0.3"
# The allocator and the data and cache directories of the desktop `main`.
mimalloc3 = "0.1"
dirs = "7"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# The NEON assembly of `rav1e`, which halves the time an imported book
# spends encoding its pictures (mbook-ui docs, "Design"). The feature is
# named after NASM, but on ARM it assembles with the C compiler alone; on
# x86 it would need NASM, so it is enabled for ARM only.
image = { workspace = true, features = ["nasm"] }

[target.'cfg(target_os = "android")'.dependencies]
# The GPUI platform of Android: window, input, renderer, and the file picker
# of the Storage Access Framework. Pinned to a commit of the fork
# Mnwa/gpui-mobile, which moves it to the gpui-pre of gpui-kit 0.11; upstream
# is on an older gpui-pre, and crates.io has only a release for an older one
# still (mbook-ui docs, "Design").
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/Mnwa/gpui-mobile", rev = "d3eddb8985b02821e8215ae5f3916e18f5799766", default-features = false }
# Records reach logcat through the logger `mbook-android` installs.
log = "0.4"
# Calls the activity for the documents it received and for the share sheet;
# the version of gpui-mobile, whose environment it runs in.
jni = "0.22"

# The tests run on the desktop only.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
gpui-kit = { version = "0.11", features = ["gpui-fast", "test-support"] }

# The screens are rendered on the main thread, which a test harness does not
# run its tests on: the test has a `main` of its own.
[[test]]
name = "visual"
path = "tests/visual.rs"
harness = false
required-features = ["visual"]

[target.'cfg(windows)'.dependencies]
# Registers the book formats for the user who runs the application: the
# installer registers none (mbook-ui docs, "Opening files from the system").
windows-registry = "0.100"

# The icon of the Windows executable (`build.rs`): the `.ico` is made from the
# PNG of the bundle and compiled in as a resource.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[lints]
workspace = true
