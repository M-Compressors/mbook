[package]
name = "mbook-ui"
description = "A reading application for mbook files: a library, a reader and an editor"
version.workspace = true
edition.workspace = true
# Above the workspace: `avif-decode` needs Rust 1.98 and `redb` 1.90
# (RFC 0004, "Crate and workspace").
rust-version = "1.100"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebook", "reader", "gpui", "mbook"]
categories = ["gui", "multimedia"]
build = "build.rs"
# An application, installed from the releases of the repository.
publish = false

# Read by `cargo bundle`, which the release workflow runs.
[package.metadata.bundle]
name = "mbook"
identifier = "io.github.m-compressors.mbook"
icon = ["assets/icon.png", "assets/icon@2x.png"]
category = "public.app-category.reference"
osx_minimum_system_version = "11.0"

[lib]
name = "mbook_ui"

[[bin]]
name = "mbook"
path = "src/main.rs"
# The executable has the name of the `mbook` library: its documentation would
# be written over that one.
doc = false

[features]
default = ["self-update"]
# Checks the releases of the repository for a newer version and installs it.
# A build for a store or a package manager leaves it off.
self-update = ["dep:self_update"]
# Renders every screen to a PNG file in a headless window, for `tests/visual.rs`
# and for a person who wants to look at the screens (RFC 0004, "Visual check").
# It needs the testing tools of the Kit to drive the pages; the application
# does not use it.
visual = ["gpui-kit/test-support"]

[dependencies]
mbook = { workspace = true, features = ["read", "write"] }
mbook-converter = { path = "../mbook-converter", version = "0.2.0" }
image.workspace = true
markdown.workspace = true
percent-encoding.workspace = true
regex = "1"
unicode-segmentation = "1"
tempfile.workspace = true
thiserror.workspace = true
uuid.workspace = true
# GPUI, its component library and their assets behind one name. `gpui-fast`
# selects the GPUI Fast engine; application code imports `gpui_kit` only.
gpui-kit = { version = "0.10", features = ["gpui-fast", "tree-sitter-markdown"] }
gpui-kit-markdown-editor = { version = "0.3.1", features = ["gpui-fast"] }
# Grammars for the diagram and formula source dialogs.
tree-sitter-mermaid = "0.3.5"
codebook-tree-sitter-latex = "0.6.1"
# Keep original source blocks when updating Markdown from the visual editor.
similar = { version = "3", default-features = false }
mimalloc3 = "0.1"
# The data and cache directories of the platform.
dirs = "7"
# The catalogue: reading places, settings and a copy of each book's metadata.
redb = "5"
# Decodes the AVIF pictures of a book; pure Rust, on `rav1d`. Without its
# `binary` feature, which is a command-line tool.
avif-decode = { version = "3", default-features = false }
# The channel between the editor and the task that owns the book.
futures = "0.3"
# Updates from the releases of the repository. The blocking `ureq` transport
# runs inside a background task, so no second runtime is needed; `signatures`
# verifies an archive against a key built into the application.
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "signatures"], optional = true }
# Native file pickers with extension filters.
rfd = "0.18"
# Diagrams and formulas of a book are drawn as SVG (RFC 0004, "Diagrams and
# formulas"). `merman` reads Mermaid notation; without ELK, whose layout is
# EPL-2.0, and without math in labels.
merman = { version = "0.11", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
# KaTeX notation: parsed, laid out and written as SVG with the glyphs as
# outlines, so that no font has to be installed.
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-types = "0.1"
ratex-svg = { version = "0.1", features = ["embed-fonts"] }
# The metrics of letters the KaTeX fonts do not have (Cyrillic): `ratex`
# draws them with a system font and guesses their room, so the real sizes
# are read from that font (`entities/figure/glyphs.rs`).
ratex-font = "0.1"
ratex-unicode-font = "0.1"
ab_glyph = "0.2"
# The configuration of `merman` and the generic walk over a parsed formula.
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.10", features = ["gpui-fast", "test-support"] }

# The screens are rendered on the main thread, which a test harness does not
# run its tests on: the test has a `main` of its own.
[[test]]
name = "visual"
path = "tests/visual.rs"
harness = false
required-features = ["visual"]

# The icon of the Windows executable (`build.rs`): the `.ico` is made from the
# PNG of the bundle and compiled in as a resource.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[lints]
workspace = true
